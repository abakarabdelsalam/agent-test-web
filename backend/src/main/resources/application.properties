spring.application.name=agent-test-web

# fake : réponses simulées, gratuit. real : appel à l'API Claude, payant.
agent.claude.mode=${CLAUDE_MODE:fake}
agent.claude.model=${CLAUDE_MODEL:claude-haiku-5-5}
agent.claude.max-tokens=500
# Plus large pour l'agent : la réflexion du modèle et ses demandes d'action comptent dans cette limite.
agent.claude.tool-max-tokens=4096
# Prix de claude-haiku-5-5 en dollars par million de jetons, pour des prompts de moins de 100 000 jetons.
agent.claude.price-input-per-million=0.10
agent.claude.price-output-per-million=0.50

# Garde-fous d'un parcours : le premier atteint arrête l'agent.
agent.limits.max-actions=20
agent.limits.max-duration=3m
agent.limits.max-budget-usd=0.05

# Comportement attendu du site, lu par l'agent. Chemin relatif au dossier backend.
agent.specs-path=../specs/specifications.md
agent.claude.api-key=${ANTHROPIC_API_KEY:}

# Mode observation : fenêtre Chromium visible, pause d'une seconde entre les actions, journal en console.
agent.headed=${AGENT_HEADED:false}

# Seuls ces hôtes peuvent être ouverts par le navigateur.
agent.allowed-hosts=localhost,127.0.0.1

# Historique des parcours : PostgreSQL lancé par compose.yaml (voir le README).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agent}
spring.datasource.username=${DATABASE_USER:agent}
spring.datasource.password=${DATABASE_PASSWORD:agent}
# Crée les tables au démarrage. Un outil de migration viendra si le schéma évolue.
spring.jpa.hibernate.ddl-auto=update
