spring.application.name=agent-test-web

# fake : réponses simulées, gratuit. real : appel à l'API Claude, payant.
agent.claude.mode=${CLAUDE_MODE:fake}
agent.claude.model=${CLAUDE_MODEL:claude-haiku-5-5}
agent.claude.max-tokens=500
# Plus large pour l'agent : la réflexion du modèle et ses demandes d'action comptent dans cette limite.
agent.claude.tool-max-tokens=4096
agent.claude.api-key=${ANTHROPIC_API_KEY:}

# Mode observation : fenêtre Chromium visible, pause d'une seconde entre les actions, journal en console.
agent.headed=${AGENT_HEADED:false}

# Seuls ces hôtes peuvent être ouverts par le navigateur.
agent.allowed-hosts=localhost,127.0.0.1
