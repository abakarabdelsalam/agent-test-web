version: 1
id: techshop
title: Tester TechShop avec l'agent
description: Parcours de démonstration. Le lancement de l'agent se fait avant la capture, par son API en mode simulé.
kind: proof
status: ready
language: fr
audience: Recruteurs et lecteurs du portfolio
viewport:
  width: 1920
  height: 1080
setup: []
chapters:
  - id: site
    title: Un site à tester
    narration: Voici TechShop, une boutique de démonstration. Elle contient vingt bugs volontaires. Un agent d'intelligence artificielle doit les trouver en comparant le site à ses spécifications.
    steps:
      - action: navigate
        surface: techshop
        path: /
        caption: TechShop, la boutique à tester
        holdMs: 5000
  - id: bug
    title: Un écart à la spécification
    narration: Par exemple, la spécification dit que la recherche ignore les majuscules. Pourtant, casque en minuscules ne trouve rien, alors que Casque avec une majuscule trouve le produit. C'est ce genre d'écart que l'agent doit signaler.
    steps:
      - action: fill
        selector:
          testId: search
        value: casque
        caption: Recherche de « casque »
        focus: true
        holdMs: 1500
      - action: waitFor
        selector:
          testId: no-result
        caption: "Aucun résultat : écart SPEC-01"
        holdMs: 3500
        timeoutMs: 15000
      - action: fill
        selector:
          testId: search
        value: Casque
        caption: Avec une majuscule, le produit apparaît
        holdMs: 1500
      - action: waitFor
        selector:
          testId: product-card
        caption: Résultats du catalogue
        holdMs: 3000
        timeoutMs: 15000
  - id: historique
    title: Ce que l'agent a fait
    narration: Chaque parcours de l'agent est enregistré, avec ses actions, ses bugs et son coût. Une personne valide ou rejette chaque bug avant qu'il compte.
    steps:
      - action: navigate
        surface: historique
        path: /
        caption: Historique des parcours
        holdMs: 3000
      - action: click
        selector:
          css: "#runs tr.clickable:first-child"
        caption: Détail du dernier parcours
        focus: true
        holdMs: 3500
  - id: score
    title: Où en est le score
    narration: Aujourd'hui, l'agent trouve quatre à cinq bugs sur vingt, sans fausse alerte. La cible est de quinze. Le travail continue.
    steps:
      - action: waitFor
        selector:
          css: body
        caption: 4 à 5 bugs sur 20, aucune fausse alerte, cible 15
        holdMs: 5000
        timeoutMs: 15000
